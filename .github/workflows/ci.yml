# Pipeline CI/CD de Azmuth — se ejecuta en cada push y pull request.
# Etapas: 1) Validación estática  2) Seguridad  3) Pruebas + cobertura
#         4) Métricas  5) Análisis de calidad con IA (Claude)  6) Build y prueba en Docker
name: CI Azmuth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # para guardar las métricas en metricas/resultados/

jobs:
  calidad:
    name: Validación, pruebas y métricas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: "Validación estática (gate): estilo y errores con ruff (0 permitidos)"
        run: ruff check .

      - name: "Gate de complejidad: ninguna función en rango D o peor (CC > 20)"
        run: |
          peores=$(radon cc . -n D -s -e "tests/*,metricas/*")
          if [ -n "$peores" ]; then echo "$peores"; exit 1; fi
          echo "OK: complejidad máxima dentro del rango A-C"

      - name: "Seguridad (gate): dependencias con vulnerabilidades conocidas (pip-audit)"
        run: |
          mkdir -p reports
          pip-audit -r requirements-dev.txt --progress-spinner off | tee reports/seguridad_dependencias.txt

      - name: Seguridad del código (bandit, no bloquea)
        run: |
          bandit -r . -x ./tests,./metricas -ll -f txt -o reports/seguridad_codigo.txt --exit-zero
          tail -n 25 reports/seguridad_codigo.txt

      - name: Reporte completo de estilo (no bloquea)
        run: |
          mkdir -p reports
          ruff check . --exit-zero --output-format=concise | tee reports/ruff.txt

      - name: Pruebas automatizadas con cobertura
        run: |
          pytest --cov --cov-report=term --cov-report=xml:reports/coverage.xml \
                 --cov-report=json:reports/coverage.json --junitxml=reports/pruebas.xml

      - name: Complejidad ciclomática y mantenibilidad (radon)
        run: |
          radon cc . -s -a -e "tests/*,metricas/*" | tee reports/complejidad.txt
          radon cc . -j -e "tests/*,metricas/*" > reports/complejidad.json
          radon mi . -s -e "tests/*,metricas/*" | tee reports/mantenibilidad.txt
          radon raw . -s -e "tests/*,metricas/*" > reports/lineas.txt

      - name: Calcular métricas de producto, proceso y proyecto
        run: python metricas/calcular_metricas.py --reportes reports --historial metricas/resultados/historial.csv

      - name: Técnicas de estimación (expertos, análoga, tres puntos, puntos de función)
        run: python metricas/estimacion.py --reportes reports

      - name: Gráficas de calidad
        run: python metricas/graficas.py --reportes reports --salida reports/graficas

      - name: Análisis de calidad con IA (Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python metricas/analisis_ia.py --reportes reports

      - name: Publicar resumen en GitHub
        if: always()
        run: |
          cat reports/metricas.md >> "$GITHUB_STEP_SUMMARY" || true
          cat reports/estimacion.md >> "$GITHUB_STEP_SUMMARY" || true
          cat reports/analisis_ia.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Guardar métricas en el repositorio (metricas/resultados)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p metricas/resultados
          cp reports/metricas.md reports/metricas.json reports/estimacion.md reports/estimacion.json \
             reports/analisis_ia.md reports/complejidad.txt reports/mantenibilidad.txt reports/ruff.txt \
             reports/seguridad_dependencias.txt reports/seguridad_codigo.txt \
             metricas/resultados/
          mkdir -p metricas/resultados/graficas
          cp reports/graficas/*.png metricas/resultados/graficas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metricas/resultados
          if ! git diff --cached --quiet; then
            git commit -m "Métricas automáticas del commit ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Guardar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: reports/

  docker:
    name: Build y prueba en contenedor
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t azmuth:${{ github.sha }} .

      - name: Correr las pruebas dentro del contenedor
        run: docker run --rm azmuth:${{ github.sha }} pytest -q

      - name: Prueba de humo del servidor (API /estado)
        run: |
          docker run -d --name azmuth -p 8080:8080 azmuth:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://localhost:8080/estado && break || sleep 1; done
          curl -fs http://localhost:8080/estado
          docker logs azmuth
          docker rm -f azmuth
