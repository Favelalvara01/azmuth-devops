[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "metricas/*", "migrar_json_a_sqlite.py"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["metricas/resultados"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E701", "W291", "W293"]
