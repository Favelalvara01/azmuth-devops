<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azmuth OS - JARVIS</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background: radial-gradient(circle, #022314 0%, #010c07 100%);
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 10px;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        h1 {
            color: #facc15;
            font-size: 16px;
            margin: 8px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.7);
        }

        /* ---------- Núcleo JARVIS Animado ---------- */
        .reactor-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 12px auto 4px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.4s ease;
        }
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 2px dashed rgba(0, 255, 102, 0.4);
            transition: border-color 0.4s ease, animation-duration 0.4s ease;
        }
        .ring-1 { width: 140px; height: 140px; animation: spin 10s linear infinite; border-color: #00ff66 transparent #00ff66 transparent; }
        .ring-2 { width: 105px; height: 105px; animation: spin-reverse 7s linear infinite; border-color: transparent #ff7700 transparent #ff7700; }
        .core {
            width: 50px; height: 50px;
            background: radial-gradient(circle, #00ff66 0%, #ff7700 100%);
            border-radius: 50%;
            box-shadow: 0 0 20px #00ff66, 0 0 40px #ff7700;
            animation: pulse 2.4s ease-in-out infinite;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes pulse-fast { 0%, 100% { transform: scale(0.92); opacity: 0.85; } 50% { transform: scale(1.12); opacity: 1; } }
        @keyframes think { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.06) rotate(8deg); } }
        @keyframes flash { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.6; } }

        /* Estado: REPOSO (ambiental, esperando la palabra clave) */
        .estado-reposo .core { animation: pulse 2.4s ease-in-out infinite; }

        /* Estado: ESCUCHANDO (capturando la orden por el micrófono) */
        .estado-escuchando .core {
            background: radial-gradient(circle, #22d3ee 0%, #0ea5e9 100%);
            box-shadow: 0 0 26px #22d3ee, 0 0 55px #0ea5e9;
            animation: pulse-fast 0.9s ease-in-out infinite;
        }
        .estado-escuchando .ring-1 { border-color: #22d3ee transparent #22d3ee transparent; animation-duration: 4s; }
        .estado-escuchando .ring-2 { border-color: transparent #0ea5e9 transparent #0ea5e9; animation-duration: 3s; }

        /* Estado: PROCESANDO (interpretando el comando / pensando) */
        .estado-procesando .core {
            background: radial-gradient(circle, #c084fc 0%, #7c3aed 100%);
            box-shadow: 0 0 26px #c084fc, 0 0 55px #7c3aed;
            animation: think 0.9s ease-in-out infinite;
        }
        .estado-procesando .ring-1 { border-color: #c084fc transparent #c084fc transparent; animation-duration: 2.5s; }
        .estado-procesando .ring-2 { border-color: transparent #7c3aed transparent #7c3aed; animation-duration: 1.8s; }

        /* Estado: EJECUTANDO (realizando la acción / hablando) */
        .estado-ejecutando .core {
            background: radial-gradient(circle, #fb923c 0%, #ef4444 100%);
            box-shadow: 0 0 30px #fb923c, 0 0 60px #ef4444;
            animation: flash 0.5s ease-in-out infinite;
        }
        .estado-ejecutando .ring-1 { border-color: #fb923c transparent #fb923c transparent; animation-duration: 3s; }
        .estado-ejecutando .ring-2 { border-color: transparent #ef4444 transparent #ef4444; animation-duration: 2s; }

        #statusText {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #86efac;
            margin: 2px 0 10px 0;
            min-height: 14px;
            transition: color 0.4s ease;
        }
        .estado-escuchando ~ #statusText, #statusText.escuchando { color: #22d3ee; }
        .estado-procesando ~ #statusText, #statusText.procesando { color: #c084fc; }
        .estado-ejecutando ~ #statusText, #statusText.ejecutando { color: #fb923c; }

        .card {
            background: rgba(2, 44, 24, 0.9);
            border: 2px solid #22c55e;
            border-radius: 14px;
            padding: 12px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
        }
        .console-box {
            margin-top: 4px;
            background: rgba(1, 12, 7, 0.95);
            border: 1px solid #059669;
            border-radius: 8px;
            padding: 10px;
            font-size: 11px;
            color: #34d399;
            min-height: 90px;
            max-height: 140px;
            overflow-y: auto;
            text-align: left;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
        }
        .log-line { margin-bottom: 3px; border-bottom: 1px solid rgba(5, 150, 105, 0.2); word-wrap: break-word; }

        /* ================= MODO ESCRITORIO (chat escrito) ================= */
        body.modo-escritorio { padding: 0; text-align: left; }
        body.modo-escritorio #vistaVoz { display: none; }
        body:not(.modo-escritorio) #vistaEscritorio { display: none; }

        .btn-modo {
            margin-top: 10px; width: 100%; padding: 7px 10px; cursor: pointer;
            background: rgba(250, 204, 21, 0.08); color: #facc15; border: 1px solid #a16207;
            border-radius: 8px; font-family: inherit; font-size: 11px; letter-spacing: 1px;
        }
        .btn-modo:hover { background: rgba(250, 204, 21, 0.18); }

        #vistaEscritorio {
            display: grid; grid-template-columns: 250px 1fr; height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; color: #d1fae5;
            -webkit-user-select: text; user-select: text;
        }
        .lateral {
            background: rgba(1, 16, 9, 0.96); border-right: 1px solid #065f46;
            display: flex; flex-direction: column; min-height: 0;
        }
        .lateral-top { padding: 14px 12px 10px; border-bottom: 1px solid rgba(6, 95, 70, 0.6); }
        .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .mini-core {
            width: 26px; height: 26px; border-radius: 50%; flex: none;
            background: radial-gradient(circle, #00ff66 0%, #ff7700 100%);
            box-shadow: 0 0 10px #00ff66, 0 0 18px #ff7700; animation: pulse 2.4s ease-in-out infinite;
        }
        .mini-core.estado-escuchando { background: radial-gradient(circle, #22d3ee, #0ea5e9); box-shadow: 0 0 12px #22d3ee; animation: pulse-fast .9s infinite; }
        .mini-core.estado-procesando { background: radial-gradient(circle, #c084fc, #7c3aed); box-shadow: 0 0 12px #c084fc; animation: think .9s infinite; }
        .mini-core.estado-ejecutando { background: radial-gradient(circle, #fb923c, #ef4444); box-shadow: 0 0 12px #fb923c; animation: flash .5s infinite; }
        .marca-texto b { display: block; color: #facc15; font-family: 'Courier New', monospace; letter-spacing: 2px; font-size: 14px; }
        .marca-texto span { font-size: 10px; color: #86efac; letter-spacing: 1px; font-family: 'Courier New', monospace; }
        .btn-nuevo {
            width: 100%; padding: 9px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px;
            background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; font-family: inherit;
        }
        .btn-nuevo:hover { background: #166534; }
        .lista-chats { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
        .chat-item {
            display: flex; align-items: center; gap: 6px; padding: 8px 9px; border-radius: 8px;
            cursor: pointer; font-size: 13px; color: #a7f3d0; margin-bottom: 2px;
        }
        .chat-item:hover { background: rgba(34, 197, 94, 0.10); }
        .chat-item.activo { background: rgba(34, 197, 94, 0.20); color: #ecfdf5; }
        .chat-item .titulo { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item .acciones { display: none; gap: 2px; }
        .chat-item:hover .acciones { display: flex; }
        .icono-btn {
            background: none; border: none; color: #6ee7b7; cursor: pointer; font-size: 13px;
            padding: 2px 5px; border-radius: 5px;
        }
        .icono-btn:hover { background: rgba(110, 231, 183, 0.15); color: #fff; }
        .lateral-pie { border-top: 1px solid rgba(6, 95, 70, 0.6); padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
        .lateral-pie .btn-modo { margin-top: 0; }
        .fila-pie { display: flex; gap: 6px; }
        .fila-pie .btn-modo { flex: 1; }
        .btn-idioma { margin-top: 6px; }

        .principal { display: flex; flex-direction: column; min-width: 0; min-height: 0;
            background: radial-gradient(ellipse at top, #022314 0%, #010c07 75%); }
        .barra {
            padding: 10px 22px; border-bottom: 1px solid rgba(6, 95, 70, 0.6); display: flex; align-items: center; gap: 10px;
        }
        .barra h2 { margin: 0; font-size: 15px; color: #ecfdf5; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #estadoChat { font-family: 'Courier New', monospace; font-size: 11px; color: #86efac; letter-spacing: 1px; }
        #estadoChat.procesando { color: #c084fc; } #estadoChat.escuchando { color: #22d3ee; } #estadoChat.ejecutando { color: #fb923c; }

        .mensajes { flex: 1; overflow-y: auto; padding: 22px 0 10px; min-height: 0; }
        .columna { max-width: 780px; margin: 0 auto; padding: 0 22px; }
        .msg { display: flex; gap: 12px; margin-bottom: 18px; }
        .msg.user { justify-content: flex-end; }
        .avatar {
            width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
            font-family: 'Courier New', monospace; font-weight: bold; font-size: 11px; color: #052e16;
            background: radial-gradient(circle, #4ade80, #f97316);
        }
        .burbuja { line-height: 1.6; font-size: 14.5px; max-width: 100%; overflow-wrap: anywhere; }
        .msg.user .burbuja {
            background: #14532d; border: 1px solid #22c55e; color: #f0fdf4;
            padding: 9px 14px; border-radius: 16px 16px 4px 16px; max-width: 75%; white-space: pre-wrap;
        }
        .msg.assistant .burbuja { color: #e7fbe9; padding-top: 4px; flex: 1; }
        .etiqueta-voz { font-size: 10px; color: #67e8f9; margin-top: 3px; text-align: right; font-family: 'Courier New', monospace; }
        .burbuja p { margin: 0 0 10px; } .burbuja p:last-child { margin-bottom: 0; }
        .burbuja h1, .burbuja h2, .burbuja h3 { color: #facc15; margin: 14px 0 8px; font-size: 16px; text-shadow: none; letter-spacing: 0; }
        .burbuja ul, .burbuja ol { margin: 4px 0 10px; padding-left: 22px; }
        .burbuja li { margin-bottom: 3px; }
        .burbuja a { color: #67e8f9; }
        .burbuja strong { color: #fff; }
        .burbuja code { background: rgba(0, 0, 0, 0.45); border: 1px solid #065f46; border-radius: 5px; padding: 1px 5px; font-family: Consolas, 'Courier New', monospace; font-size: 13px; color: #fde68a; }
        .bloque-codigo { position: relative; margin: 8px 0 12px; border: 1px solid #065f46; border-radius: 9px; overflow: hidden; background: #020a06; }
        .bloque-codigo .cab { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; background: rgba(6, 95, 70, 0.35); font-size: 11px; color: #86efac; font-family: 'Courier New', monospace; }
        .bloque-codigo pre { margin: 0; padding: 12px; overflow-x: auto; }
        .bloque-codigo pre code { background: none; border: none; padding: 0; color: #d1fae5; }
        .btn-copiar { background: none; border: 1px solid #047857; color: #86efac; border-radius: 5px; cursor: pointer; font-size: 10px; padding: 2px 7px; }
        .burbuja table { border-collapse: collapse; margin: 8px 0 12px; font-size: 13px; }
        .burbuja th, .burbuja td { border: 1px solid #065f46; padding: 5px 9px; text-align: left; }
        .burbuja th { background: rgba(6, 95, 70, 0.45); color: #ecfdf5; }

        .pensando { display: flex; gap: 5px; padding-top: 10px; }
        .pensando span { width: 7px; height: 7px; border-radius: 50%; background: #c084fc; animation: pulse-fast 1s infinite; }
        .pensando span:nth-child(2) { animation-delay: .15s; } .pensando span:nth-child(3) { animation-delay: .3s; }

        .vacio { text-align: center; padding-top: 12vh; }
        .vacio .reactor-container { transform: scale(0.8); }
        .vacio h3 { color: #facc15; font-family: 'Courier New', monospace; letter-spacing: 2px; margin: 4px 0 6px; }
        .vacio p { color: #86efac; font-size: 13.5px; margin: 0 0 18px; }
        .sugerencias { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; margin: 0 auto; }
        .sugerencia { background: rgba(2, 44, 24, 0.8); border: 1px solid #047857; color: #bbf7d0; border-radius: 18px; padding: 7px 13px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
        .sugerencia:hover { border-color: #22c55e; background: rgba(20, 83, 45, 0.9); }

        .entrada { padding: 10px 0 16px; }
        .caja-entrada {
            display: flex; align-items: flex-end; gap: 8px; background: rgba(2, 30, 16, 0.95);
            border: 1px solid #047857; border-radius: 14px; padding: 8px 8px 8px 14px;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.12);
        }
        .caja-entrada:focus-within { border-color: #22c55e; }
        #textoEntrada {
            flex: 1; background: none; border: none; outline: none; resize: none; color: #f0fdf4;
            font-family: inherit; font-size: 14.5px; line-height: 1.5; max-height: 180px; padding: 5px 0;
        }
        #textoEntrada::placeholder { color: #4d7c63; }
        #btnEnviar {
            width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; flex: none;
            background: #22c55e; color: #052e16; font-size: 17px; font-weight: bold;
        }
        #btnEnviar:disabled { background: #14532d; color: #4d7c63; cursor: default; }
        .ayuda-entrada { text-align: center; font-size: 11px; color: #4d7c63; margin-top: 6px; }
        .lateral .console-box { max-height: 90px; min-height: 0; font-size: 10px; margin-top: 0; font-family: 'Courier New', monospace; }
        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }

        /* ================= TEMÁTICAS DE TEMPORADA (tematicas.py) =================
           Cada temática define variables y su arte vive en el JS (ARTE_TEMA): núcleo
           dibujado en SVG, escenario de fondo, marco de la tarjeta y partículas.
           Los colores de ESCUCHANDO / PROCESANDO / EJECUTANDO siguen siendo los de
           siempre (anillos y brillo del núcleo), para que el estado se note. */
        /* Letras de las temáticas: van incluidas en imagenes/fuentes (funcionan sin internet) */
        @font-face { font-family: 'Creepster'; src: url('/imagenes/fuentes/creepster.woff2') format('woff2'); font-display: swap; }
        @font-face { font-family: 'Lobster'; src: url('/imagenes/fuentes/lobster.woff2') format('woff2'); font-display: swap; }
        @font-face { font-family: 'Mountains of Christmas'; src: url('/imagenes/fuentes/mountains-of-christmas.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        @font-face { font-family: 'Dancing Script'; src: url('/imagenes/fuentes/dancing-script.woff2') format('woff2'); font-weight: 700; font-display: swap; }
        body.tema-sanvalentin {
            --t-fondo1: #4c0b31; --t-fondo2: #12030b; --t-texto: #fbcfe8; --t-titulo: #f9a8d4;
            --t-acento: #f43f5e; --t-acento2: #f472b6; --t-glow: rgba(244, 63, 94, 0.38);
            --t-card: rgba(46, 8, 30, 0.88); --t-consola-bg: rgba(18, 3, 11, 0.94); --t-consola: #fbcfe8;
            --t-borde: #be185d; --t-panel: rgba(30, 5, 18, 0.94); --t-boton: #9f1239;
            --t-core: radial-gradient(circle, #ffe4e6 0%, #fb7185 45%, #be123c 100%);
            --t-fuente: 'Dancing Script', 'Segoe Script', cursive; --t-tam-titulo: 28px; --t-esp-titulo: 1px;
        }
        body.tema-halloween {
            --t-fondo1: #2a1140; --t-fondo2: #07030c; --t-texto: #fdba74; --t-titulo: #fb923c;
            --t-acento: #f97316; --t-acento2: #a855f7; --t-glow: rgba(249, 115, 22, 0.35);
            --t-card: rgba(24, 8, 36, 0.88); --t-consola-bg: rgba(10, 4, 16, 0.94); --t-consola: #fdba74;
            --t-borde: #6b21a8; --t-panel: rgba(16, 6, 24, 0.94); --t-boton: #431407;
            --t-core: radial-gradient(circle, #fde047 0%, #f97316 55%, #9a3412 100%);
            --t-fuente: 'Creepster', 'Chiller', 'Papyrus', fantasy; --t-tam-titulo: 25px; --t-esp-titulo: 3px;
        }
        body.tema-muertos {
            --t-fondo1: #3b0d3a; --t-fondo2: #0b030d; --t-texto: #fde68a; --t-titulo: #fbbf24;
            --t-acento: #f59e0b; --t-acento2: #ec4899; --t-glow: rgba(236, 72, 153, 0.35);
            --t-card: rgba(38, 8, 36, 0.88); --t-consola-bg: rgba(14, 4, 14, 0.94); --t-consola: #fcd34d;
            --t-borde: #be185d; --t-panel: rgba(24, 6, 22, 0.94); --t-boton: #831843;
            --t-core: radial-gradient(circle, #fef3c7 0%, #f59e0b 50%, #db2777 100%);
            --t-fuente: 'Lobster', 'Segoe Script', cursive; --t-tam-titulo: 24px; --t-esp-titulo: 1.5px;
        }
        body.tema-navidad {
            --t-fondo1: #0d2f4a; --t-fondo2: #020812; --t-texto: #e0f2fe; --t-titulo: #fde68a;
            --t-acento: #ef4444; --t-acento2: #22c55e; --t-glow: rgba(239, 68, 68, 0.35);
            --t-card: rgba(6, 30, 22, 0.88); --t-consola-bg: rgba(3, 14, 10, 0.94); --t-consola: #d9f99d;
            --t-borde: #b91c1c; --t-panel: rgba(4, 20, 16, 0.94); --t-boton: #7f1d1d;
            --t-core: radial-gradient(circle, #ffffff 0%, #fca5a5 40%, #dc2626 100%);
            --t-fuente: 'Mountains of Christmas', 'Segoe Print', cursive; --t-tam-titulo: 26px; --t-esp-titulo: 2px;
        }

        /* ---- Colores generales ---- */
        body.tematica { background: radial-gradient(ellipse at 50% 20%, var(--t-fondo1) 0%, var(--t-fondo2) 85%); color: var(--t-texto); }
        body.tematica .card { background: var(--t-card); border-color: var(--t-acento); box-shadow: 0 0 28px var(--t-glow); position: relative; z-index: 2; }
        body.tematica .console-box { background: var(--t-consola-bg); border-color: var(--t-borde); color: var(--t-consola); box-shadow: inset 0 0 12px var(--t-glow); }
        body.tematica .log-line { border-bottom-color: rgba(255, 255, 255, 0.08); }
        body.tematica #statusText.reposo, body.tematica .marca-texto span, body.tematica .vacio p,
        body.tematica #estadoChat:not(.procesando):not(.escuchando):not(.ejecutando) { color: var(--t-texto); }
        body.tematica .btn-modo { color: var(--t-titulo); border-color: var(--t-borde); background: rgba(255, 255, 255, 0.05); }
        body.tematica .btn-modo:hover { background: var(--t-glow); }
        body.tematica .estado-reposo .ring-1 { border-color: var(--t-acento) transparent var(--t-acento) transparent; }
        body.tematica .estado-reposo .ring-2 { border-color: transparent var(--t-acento2) transparent var(--t-acento2); }
        body.tematica .avatar { background: var(--t-core); box-shadow: 0 0 10px var(--t-glow); }
        body.tematica .lateral { background: var(--t-panel); border-right-color: var(--t-borde); position: relative; z-index: 2; }
        body.tematica .lateral-top, body.tematica .lateral-pie, body.tematica .barra { border-color: var(--t-borde); }
        body.tematica .principal { background: transparent; position: relative; z-index: 2; }
        body.tematica .btn-nuevo, body.tematica .msg.user .burbuja { background: var(--t-boton); border-color: var(--t-acento); color: #fff7ed; }
        body.tematica .chat-item { color: var(--t-texto); }
        body.tematica .chat-item.activo, body.tematica .chat-item:hover { background: var(--t-glow); }
        body.tematica .caja-entrada, body.tematica .sugerencia { border-color: var(--t-borde); background: var(--t-card); }
        body.tematica .caja-entrada:focus-within { border-color: var(--t-acento); }
        body.tematica #btnEnviar { background: var(--t-acento); color: #fff; }
        body.tematica .msg.assistant .burbuja { color: #fdf4ff; }
        body.tematica ::-webkit-scrollbar-thumb { background: var(--t-borde); }

        /* ---- Tipografía de la temática ---- */
        body.tematica h1, body.tematica .vacio h3, body.tematica .marca-texto b {
            font-family: var(--t-fuente); font-weight: 700; color: var(--t-titulo);
            letter-spacing: var(--t-esp-titulo); text-shadow: 0 0 12px var(--t-glow), 0 2px 0 rgba(0, 0, 0, 0.6);

        // llegaba a ese tope, su tamaño se quedaba fijo en 40 para

        let ultimoLogTotal = 0;

        function aplicarEstado(nombreEstado, detalle) {
            const contenedor = document.getElementById('reactorContainer');
            const statusText = document.getElementById('statusText');
            const claseValida = ETIQUETAS.hasOwnProperty(nombreEstado) ? nombreEstado : 'reposo';

            contenedor.className = 'reactor-container estado-' + claseValida;

        function actualizarConsola(log, logTotal) {
            if (!log || typeof logTotal !== 'number' || logTotal <= ultimoLogTotal) return;

            const nuevas = logTotal - ultimoLogTotal;
            // Si hubo un hueco más grande que lo que el backend guarda
            // (por ejemplo, la ventana estuvo cerrada un rato), mostramos
            // lo más que tengamos disponible en vez de intentar leer
            // líneas que ya se recortaron.
            const desde = Math.max(0, log.length - nuevas);

            const box = document.getElementById('consoleLog');
            for (let i = desde; i < log.length; i++) {
                const div = document.createElement('div');
                div.className = 'log-line';
                div.innerText = '> ' + log[i];
                box.appendChild(div);
            }
            // No dejamos crecer infinito el DOM de la consola visual
            while (box.children.length > 200) {
                box.removeChild(box.firstChild);
            }
            box.scrollTop = box.scrollHeight;
            ultimoLogTotal = logTotal;
        }

        // ===================== MODO ESCRITORIO =====================
        let modoActual = null;

        function escaparHTML(t) {
            return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function enLinea(t) {
            // t ya viene escapado
            return t
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
                .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
        }

        // Markdown sencillo: código, títulos, listas, tablas, negritas y enlaces
        function markdown(texto) {
            const bloques = [];
            let t = escaparHTML(texto || '').replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, codigo) => {
                bloques.push('<div class="bloque-codigo"><div class="cab"><span>' + (lang || 'código') +
                    '</span><button class="btn-copiar" onclick="copiarCodigo(this)">Copiar</button></div><pre><code>' +
                    codigo.replace(/\n$/, '') + '</code></pre></div>');
                return '\u0000' + (bloques.length - 1) + '\u0000';
            });
            const lineas = t.split('\n');
            let html = '', parrafo = [], lista = null, tabla = [];
            const cerrarParrafo = () => { if (parrafo.length) { html += '<p>' + enLinea(parrafo.join('<br>')) + '</p>'; parrafo = []; } };
            const cerrarLista = () => { if (lista) { html += '</' + lista + '>'; lista = null; } };
            const cerrarTabla = () => {
                if (!tabla.length) return;
                const filas = tabla.filter(f => !/^[\s|:-]+$/.test(f));   // quita la fila |---|---|
                html += '<table>' + filas.map((f, i) => {
                    const celdas = f.replace(/^\||\|$/g, '').split('|').map(c => enLinea(c.trim()));
                    const tag = i === 0 ? 'th' : 'td';
                    return '<tr>' + celdas.map(c => '<' + tag + '>' + c + '</' + tag + '>').join('') + '</tr>';
                }).join('') + '</table>';
                tabla = [];
            };
            for (const linea of lineas) {
                const l = linea.trimEnd();
                let m;
                if (/^\u0000\d+\u0000$/.test(l.trim())) { cerrarParrafo(); cerrarLista(); cerrarTabla(); html += l.trim(); continue; }
                if (/^\s*\|.*\|\s*$/.test(l)) { cerrarParrafo(); cerrarLista(); tabla.push(l.trim()); continue; } else cerrarTabla();
                if ((m = l.match(/^(#{1,3})\s+(.*)/))) { cerrarParrafo(); cerrarLista(); html += '<h3>' + enLinea(m[2]) + '</h3>'; continue; }
                if ((m = l.match(/^\s*[-*+]\s+(.*)/))) { cerrarParrafo(); if (lista !== 'ul') { cerrarLista(); html += '<ul>'; lista = 'ul'; } html += '<li>' + enLinea(m[1]) + '</li>'; continue; }
                if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { cerrarParrafo(); if (lista !== 'ol') { cerrarLista(); html += '<ol>'; lista = 'ol'; } html += '<li>' + enLinea(m[1]) + '</li>'; continue; }
                if (!l.trim()) { cerrarParrafo(); cerrarLista(); continue; }
                cerrarLista(); parrafo.push(l);
            }
            cerrarParrafo(); cerrarLista(); cerrarTabla();
            return html.replace(/\u0000(\d+)\u0000/g, (m, i) => bloques[+i]);
        }

        function copiarCodigo(boton) {
            const codigo = boton.closest('.bloque-codigo').querySelector('code').innerText;
            navigator.clipboard.writeText(codigo).then(() => { boton.textContent = '¡Copiado!'; setTimeout(() => boton.textContent = 'Copiar', 1200); });
        }

        async function api(ruta, metodo = 'GET', cuerpo = null) {
            const opciones = { method: metodo, cache: 'no-store', headers: {} };
            if (cuerpo) { opciones.headers['Content-Type'] = 'application/json'; opciones.body = JSON.stringify(cuerpo); }
            const r = await fetch(ruta, opciones);
            if (!r.ok) throw new Error(await r.text());
            return r.json();
        }

        function aplicarModo(modo) {
            if (modo === modoActual) return;
            modoActual = modo;
            document.body.classList.toggle('modo-escritorio', modo === 'escritorio');
            if (modo === 'escritorio') { cargarChats(true); setTimeout(() => document.getElementById('textoEntrada').focus(), 100); }
        }

        async function cambiarModo(modo) {
            try { await api('/modo', 'POST', { modo }); aplicarModo(modo); } catch (e) { console.log(e); }
        }

        async function alternarVozChat() {
            vozChat = !vozChat;
            pintarVozChat();
            try { await api('/voz_chat', 'POST', { activa: vozChat }); } catch (e) { console.log(e); }
        }
        function pintarVozChat() { document.getElementById('btnVozChat').textContent = vozChat ? tx('vozSi') : tx('vozNo'); }

        async function cargarChats(tambienMensajes) {
            const datos = await api('/chats');
            if (!chatActivo || !datos.chats.some(c => c.id === chatActivo)) {
                chatActivo = datos.activo || (datos.chats[0] && datos.chats[0].id) || null;
            }
            const lista = document.getElementById('listaChats');
            lista.innerHTML = '';
            datos.chats.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chat-item' + (c.id === chatActivo ? ' activo' : '');
                item.innerHTML = '<span class="titulo"></span><span class="acciones">' +
                    '<button class="icono-btn" title="Renombrar">✎</button><button class="icono-btn" title="Borrar">🗑</button></span>';
                item.querySelector('.titulo').textContent = c.titulo;
                item.onclick = () => abrirChat(c.id);
                const [btnRen, btnBor] = item.querySelectorAll('.icono-btn');
                btnRen.onclick = (ev) => { ev.stopPropagation(); renombrar(c); };
                btnBor.onclick = (ev) => { ev.stopPropagation(); borrar(c); };
                lista.appendChild(item);
            });
            const actual = datos.chats.find(c => c.id === chatActivo);
            document.getElementById('tituloChat').textContent = actual ? actual.titulo : tx('tituloNuevo');
            if (tambienMensajes) await cargarMensajes();
        }

        async function abrirChat(id) {
            chatActivo = id;
            await api('/chats/' + id + '/activar', 'POST');
            await cargarChats(true);
        }

        async function nuevoChat() {
            const r = await api('/chats', 'POST');
            chatActivo = r.id;
            await cargarChats(true);
            document.getElementById('textoEntrada').focus();
        }

        async function renombrar(c) {
            const titulo = prompt('Nuevo nombre del chat:', c.titulo);
            if (titulo && titulo.trim()) { await api('/chats/' + c.id, 'PATCH', { titulo }); await cargarChats(false); }
        }

        async function borrar(c) {
            if (!confirm('¿Borrar el chat "' + c.titulo + '"?')) return;
            await api('/chats/' + c.id, 'DELETE');
            if (chatActivo === c.id) chatActivo = null;
            await cargarChats(true);
        }

        function burbuja(m) {
            const fila = document.createElement('div');
            fila.className = 'msg ' + m.rol;
            if (m.rol === 'assistant') {
                fila.innerHTML = '<div class="avatar">AZ</div><div class="burbuja"></div>';
                fila.querySelector('.burbuja').innerHTML = markdown(m.texto);
            } else {
                const caja = document.createElement('div');
                caja.style.maxWidth = '75%';
                caja.innerHTML = '<div class="burbuja"></div>' + (m.origen === 'voz' ? '<div class="etiqueta-voz">🎤 por voz</div>' : '');
                caja.querySelector('.burbuja').textContent = m.texto;
                caja.querySelector('.burbuja').style.maxWidth = '100%';
                fila.appendChild(caja);
            }
            return fila;
        }


        function pintarVacio(col) {
            col.innerHTML = '<div class="vacio"><div class="reactor-container estado-reposo"><div class="ring ring-1"></div><div class="ring ring-2"></div><div class="core"></div></div>' +
                '<h3>' + tx('vacioTitulo').replace('{N}', escaparHTML(nombreUsuario || (idiomaActual === 'en' ? 'sir' : 'señor')).toUpperCase()) + '</h3><p>' + tx('vacioTexto') + '</p><div class="sugerencias"></div></div>';
            const cont = col.querySelector('.sugerencias');
            tx('sugerencias').forEach(s => {
                const b = document.createElement('button');
                b.className = 'sugerencia'; b.textContent = s;
                b.onclick = () => { document.getElementById('textoEntrada').value = s; enviar(); };
                cont.appendChild(b);
            });
        }

        async function cargarMensajes() {
            const col = document.getElementById('columnaMensajes');
            if (!chatActivo) { pintarVacio(col); return; }
            const datos = await api('/chats/' + chatActivo + '/mensajes');
            col.innerHTML = '';
            if (!datos.mensajes.length) { pintarVacio(col); return; }
            datos.mensajes.forEach(m => col.appendChild(burbuja(m)));
            bajarScroll();
        }

        function bajarScroll() { const c = document.getElementById('mensajes'); c.scrollTop = c.scrollHeight; }

        async function enviar() {
            const caja = document.getElementById('textoEntrada');
            const texto = caja.value.trim();
            if (!texto || enviando) return;
            enviando = true;
            document.getElementById('btnEnviar').disabled = true;
            caja.value = ''; ajustarAltura();
            if (!chatActivo) { const r = await api('/chats', 'POST'); chatActivo = r.id; }
            const col = document.getElementById('columnaMensajes');
            if (col.querySelector('.vacio')) col.innerHTML = '';
            col.appendChild(burbuja({ rol: 'user', texto, origen: 'texto' }));
            const pensando = document.createElement('div');
            pensando.className = 'msg assistant';
            pensando.innerHTML = '<div class="avatar">AZ</div><div class="pensando"><span></span><span></span><span></span></div>';
            col.appendChild(pensando);
            bajarScroll();
            try {
                const r = await api('/chats/' + chatActivo + '/mensajes', 'POST', { texto });
                chatActivo = r.chat_id;
                aplicarModo(r.modo);
            } catch (e) {
                pensando.remove();
                col.appendChild(burbuja({ rol: 'assistant', texto: '⚠️ No pude responder: ' + e.message }));
            }
            enviando = false;
            document.getElementById('btnEnviar').disabled = false;
            if (modoActual === 'escritorio') { await cargarChats(true); caja.focus(); }
        }

        function ajustarAltura() {
            const caja = document.getElementById('textoEntrada');
            caja.style.height = 'auto';
            caja.style.height = Math.min(caja.scrollHeight, 180) + 'px';
        }

        document.getElementById('textoEntrada').addEventListener('input', ajustarAltura);
        document.getElementById('textoEntrada').addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); enviar(); }
        });

        function actualizarEscritorio(data) {
            const etiqueta = ETIQUETAS[data.estado] || ETIQUETAS.reposo;
            document.getElementById('miniCore').className = 'mini-core estado-' + (data.estado || 'reposo');
            const est = document.getElementById('estadoChat');
            est.className = data.estado || '';
            est.textContent = etiqueta;
            // Consola mini: últimas 4 líneas
            const mini = document.getElementById('consoleMini');
            mini.innerHTML = '';
            (data.log || []).slice(-4).forEach(l => { const d = document.createElement('div'); d.className = 'log-line'; d.textContent = '> ' + l; mini.appendChild(d); });
            // Llegó un mensaje nuevo al chat (por ejemplo, un comando dicho por voz)
            if (data.version_chat !== ultimaVersionChat) {
                const primeraVez = ultimaVersionChat === -1;
                ultimaVersionChat = data.version_chat;
                if (!primeraVez && !enviando) cargarChats(true);
            }
        }

        api('/modo').then(d => { vozChat = d.voz_chat; pintarVozChat(); }).catch(() => {});

        setInterval(actualizarTodo, 500);
        actualizarTodo();
    </script>
</body>
</html>
